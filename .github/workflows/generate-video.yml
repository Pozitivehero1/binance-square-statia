name: Generate TikTok Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional exact topic (leave empty for automatic choice)"
        required: false
        type: string
      niche:
        description: "Optional niche override"
        required: false
        default: "technology, science and surprising true history"
        type: string
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

concurrency:
  group: tiktok-video-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      STRICT_APIS: "1"
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL || 'mistral-small-latest' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TOPIC: ${{ inputs.topic || '' }}
      NICHE: ${{ inputs.niche || 'technology, science and surprising true history' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate generator
        run: |
          python -m py_compile generate_video.py self_test.py
          python self_test.py

      - name: Generate video
        run: python generate_video.py

      - name: Upload ready video
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-video-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 14

      - name: Save topic history
        if: success()
        run: |
          if git diff --quiet -- history.json 2>/dev/null && [ -z "$(git status --porcelain history.json 2>/dev/null)" ]; then
            echo "No history change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -m "Update generated topic history" || true
          git push || true
