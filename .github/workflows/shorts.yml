name: Generate Crypto Shorts

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'How many Shorts (1-5)'
        required: true
        default: '1'
        type: choice
        options: ['1', '2', '3', '4', '5']
      topic:
        description: 'Optional forced topic; leave empty for automatic selection'
        required: false
        default: ''
        type: string
      upload:
        description: 'Upload to YouTube after render'
        required: true
        default: false
        type: boolean
  # Example: three automatic runs a day. Uncomment when ready.
  # schedule:
  #   - cron: '17 */8 * * *'

permissions:
  contents: read

concurrency:
  group: crypto-shorts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MISTRAL_API: ${{ secrets.MISTRAL_API }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      REFERRAL_URL: ${{ secrets.REFERRAL_URL }}
      LANGUAGE: ${{ vars.LANGUAGE || 'ru' }}
      MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL || 'mistral-large-latest' }}
      VOICE_PROVIDER: ${{ vars.VOICE_PROVIDER || 'edge' }}
      EDGE_VOICE: ${{ vars.EDGE_VOICE || 'auto' }}
      EDGE_RATE: ${{ vars.EDGE_RATE || '+6%' }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      AUTO_UPLOAD: ${{ vars.AUTO_UPLOAD || '0' }}
      YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'private' }}
      YOUTUBE_PAID_PROMOTION: ${{ vars.YOUTUBE_PAID_PROMOTION || '1' }}
      YOUTUBE_SYNTHETIC_MEDIA: ${{ vars.YOUTUBE_SYNTHETIC_MEDIA || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore history
        uses: actions/cache@v4
        with:
          path: state.json
          key: crypto-shorts-state-${{ github.run_id }}
          restore-keys: |
            crypto-shorts-state-

      - name: Restore YouTube OAuth files
        shell: bash
        env:
          CLIENT_B64: ${{ secrets.YOUTUBE_CLIENT_SECRET_B64 }}
          TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          if [ -n "$CLIENT_B64" ]; then printf '%s' "$CLIENT_B64" | base64 -d > client_secret.json; fi
          if [ -n "$TOKEN_B64" ]; then printf '%s' "$TOKEN_B64" | base64 -d > token.json; fi

      - name: Static checks
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -p 'test_*.py' -v
          python main.py --self-test

      - name: Render smoke test
        run: python tests/smoke_render.py

      - name: Generate Shorts
        shell: bash
        env:
          INPUT_COUNT: ${{ github.event.inputs.count }}
          INPUT_TOPIC: ${{ github.event.inputs.topic }}
          INPUT_UPLOAD: ${{ github.event.inputs.upload }}
        run: |
          COUNT="${INPUT_COUNT:-1}"
          ARGS=(--count "$COUNT")
          if [ -n "${INPUT_TOPIC:-}" ]; then ARGS+=(--topic "$INPUT_TOPIC"); fi
          if [ "${INPUT_UPLOAD:-}" = "true" ]; then
            export AUTO_UPLOAD=1
          elif [ "${INPUT_UPLOAD:-}" = "false" ]; then
            ARGS+=(--no-upload)
          elif [ "${AUTO_UPLOAD:-0}" != "1" ]; then
            ARGS+=(--no-upload)
          fi
          python main.py "${ARGS[@]}"

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-shorts-${{ github.run_id }}
          path: |
            output/*.mp4
            output/*.json
            output/*.srt
            state.json
          if-no-files-found: warn
          retention-days: 14
